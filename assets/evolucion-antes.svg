<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tríptico del consumidor de los años 90: descubrimiento por aviso en diario, recorrido a pie por 2-3 tiendas del barrio, decisión en mostrador con vendedor.">
  <defs>
    <linearGradient id="paperFade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F8F4EC"/>
      <stop offset="1" stop-color="#EDE5D8"/>
    </linearGradient>
    <pattern id="newsLines" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#8B8170" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <style>
      .stroke-main { stroke: #1F1B17; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #5A5147; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-soft { stroke: #8B8170; stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-accent { stroke: #3F4B30; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-dash { stroke: #5A5147; stroke-width: 1.6; fill: none; stroke-dasharray: 4 5; stroke-linecap: round; }
      .fill-ink { fill: #1F1B17; }
      .fill-soft { fill: #C7BEAF; }
      .fill-warm { fill: #E4D9C5; }
      .fill-cream { fill: #F8F4EC; }
      .fill-accent { fill: #3F4B30; }
      .fill-paper { fill: #F8F4EC; }
      .label { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.16em; fill: #5A5147; text-transform: uppercase; }
      .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: #8B8170; letter-spacing: 0.12em; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="600" fill="#E4D9C5"/>

  <!-- soft separadores entre paneles -->
  <line x1="533" y1="60" x2="533" y2="540" stroke="#8B8170" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>
  <line x1="1066" y1="60" x2="1066" y2="540" stroke="#8B8170" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>

  <!-- ============ PANEL 1 — Descubrimiento: aviso en diario ============ -->
  <g transform="translate(0,0)">
    <text x="40" y="74" class="num">01</text>
    <text x="70" y="74" class="label">Descubrimiento</text>

    <!-- diario -->
    <g transform="translate(110, 130)">
      <!-- sombra papel -->
      <rect x="6" y="8" width="320" height="380" rx="2" fill="#1F1B17" opacity="0.08"/>
      <!-- hoja del diario con leve rotación -->
      <g transform="rotate(-3 160 195)">
        <rect x="0" y="0" width="320" height="380" rx="2" class="fill-cream" stroke="#1F1B17" stroke-width="2"/>
        <!-- cabecera del diario -->
        <text x="160" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1F1B17" font-style="italic" font-weight="500">EL CLASIFICADO</text>
        <line x1="20" y1="50" x2="300" y2="50" stroke="#1F1B17" stroke-width="1"/>
        <line x1="20" y1="56" x2="300" y2="56" stroke="#1F1B17" stroke-width="0.6"/>
        <!-- columnas de texto simulado -->
        <rect x="20" y="72" width="130" height="84" fill="url(#newsLines)"/>
        <rect x="170" y="72" width="130" height="84" fill="url(#newsLines)"/>
        <!-- aviso destacado -->
        <g>
          <rect x="20" y="172" width="280" height="120" fill="#F8F4EC" stroke="#3F4B30" stroke-width="2.5"/>
          <text x="160" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3F4B30" font-weight="600" letter-spacing="1.5">VANITORYS</text>
          <text x="160" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5A5147" font-style="italic">— griferías y sanitarios —</text>
          <line x1="60" y1="236" x2="260" y2="236" stroke="#8B8170" stroke-width="0.8"/>
          <text x="160" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1F1B17">Av. Alberdi 3880</text>
          <text x="160" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5A5147">Atención personalizada</text>
        </g>
        <!-- más columnas debajo -->
        <rect x="20" y="306" width="130" height="56" fill="url(#newsLines)"/>
        <rect x="170" y="306" width="130" height="56" fill="url(#newsLines)"/>
      </g>
    </g>

    <!-- subtítulo evocativo -->
    <text x="266" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1F1B17" font-style="italic">Lo encontró en el diario del domingo.</text>
  </g>

  <!-- conector ➝ -->
  <g transform="translate(497,300)" class="stroke-soft" opacity="0.65">
    <line x1="0" y1="0" x2="36" y2="0"/>
    <polyline points="28,-6 36,0 28,6"/>
  </g>

  <!-- ============ PANEL 2 — Limitación geográfica: mapa del barrio ============ -->
  <g transform="translate(533,0)">
    <text x="40" y="74" class="num">02</text>
    <text x="70" y="74" class="label">Limitación geográfica</text>

    <!-- mapa -->
    <g transform="translate(60, 110)">
      <!-- fondo mapa -->
      <rect x="0" y="0" width="413" height="340" rx="6" fill="#F8F4EC" stroke="#1F1B17" stroke-width="2"/>
      <!-- grid de calles -->
      <g stroke="#8B8170" stroke-width="1" opacity="0.55">
        <line x1="0" y1="80" x2="413" y2="80"/>
        <line x1="0" y1="170" x2="413" y2="170"/>
        <line x1="0" y1="260" x2="413" y2="260"/>
        <line x1="100" y1="0" x2="100" y2="340"/>
        <line x1="210" y1="0" x2="210" y2="340"/>
        <line x1="320" y1="0" x2="320" y2="340"/>
      </g>
      <!-- avenida principal más gruesa -->
      <line x1="0" y1="170" x2="413" y2="170" stroke="#5A5147" stroke-width="3" opacity="0.7"/>
      <text x="395" y="164" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#5A5147" font-style="italic">Av. del barrio</text>

      <!-- camino del cliente (línea punteada conectando 3 tiendas) -->
      <path d="M 60,280 Q 100,250 150,235 T 240,170 Q 280,140 330,100" class="stroke-dash" opacity="0.85"/>

      <!-- pin tienda 1 -->
      <g transform="translate(60,280)">
        <circle r="14" class="fill-cream" stroke="#1F1B17" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#1F1B17">1</text>
      </g>
      <!-- pin tienda 2 -->
      <g transform="translate(240,170)">
        <circle r="14" class="fill-cream" stroke="#1F1B17" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#1F1B17">2</text>
      </g>
      <!-- pin tienda 3 - elegida -->
      <g transform="translate(330,100)">
        <circle r="20" class="fill-accent" stroke="#1F1B17" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#F8F4EC">3</text>
        <!-- estrella de elegida -->
        <g transform="translate(0,-32)">
          <path d="M 0,-8 L 2.4,-2.5 L 8,-2.5 L 3.5,1 L 5,7 L 0,3.5 L -5,7 L -3.5,1 L -8,-2.5 L -2.4,-2.5 Z" fill="#3F4B30"/>
        </g>
      </g>

      <!-- peatón estilizado en el camino -->
      <g transform="translate(150, 232)">
        <circle cx="0" cy="-6" r="3.5" class="fill-ink"/>
        <line x1="0" y1="-2" x2="0" y2="6" class="stroke-main"/>
        <line x1="0" y1="0" x2="-4" y2="3" class="stroke-main"/>
        <line x1="0" y1="0" x2="4" y2="3" class="stroke-main"/>
        <line x1="0" y1="6" x2="-3" y2="12" class="stroke-main"/>
        <line x1="0" y1="6" x2="3" y2="12" class="stroke-main"/>
      </g>
    </g>

    <text x="266" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1F1B17" font-style="italic">Recorre 2 ó 3 tiendas a pie. La distancia decide.</text>
  </g>

  <!-- conector ➝ -->
  <g transform="translate(1030,300)" class="stroke-soft" opacity="0.65">
    <line x1="0" y1="0" x2="36" y2="0"/>
    <polyline points="28,-6 36,0 28,6"/>
  </g>

  <!-- ============ PANEL 3 — Decisión: mostrador con vendedor ============ -->
  <g transform="translate(1066,0)">
    <text x="40" y="74" class="num">03</text>
    <text x="70" y="74" class="label">Decisión</text>

    <!-- escena del mostrador -->
    <g transform="translate(60, 130)">
      <!-- pared del fondo -->
      <rect x="0" y="0" width="413" height="200" fill="#F8F4EC" opacity="0.6"/>
      <!-- estanterías con productos -->
      <g class="stroke-thin">
        <line x1="20" y1="50" x2="170" y2="50"/>
        <line x1="20" y1="100" x2="170" y2="100"/>
        <line x1="20" y1="150" x2="170" y2="150"/>
      </g>
      <!-- objetos de muestra en estantes -->
      <rect x="35" y="22" width="20" height="28" class="fill-soft"/>
      <rect x="70" y="28" width="14" height="22" class="fill-soft"/>
      <rect x="100" y="20" width="22" height="30" class="fill-soft"/>
      <rect x="140" y="30" width="18" height="20" class="fill-soft"/>
      <rect x="35" y="74" width="14" height="26" class="fill-soft"/>
      <rect x="60" y="78" width="22" height="22" class="fill-soft"/>
      <rect x="100" y="72" width="20" height="28" class="fill-soft"/>
      <rect x="135" y="80" width="20" height="20" class="fill-soft"/>

      <!-- vanitory destacado a la derecha -->
      <g transform="translate(290, 50)">
        <rect x="0" y="40" width="100" height="80" class="fill-warm" stroke="#1F1B17" stroke-width="2"/>
        <!-- bacha encima -->
        <ellipse cx="50" cy="40" rx="36" ry="8" class="fill-cream" stroke="#1F1B17" stroke-width="2"/>
        <!-- grifería -->
        <line x1="50" y1="40" x2="50" y2="20" class="stroke-main"/>
        <line x1="50" y1="20" x2="55" y2="20" class="stroke-main"/>
        <!-- patas/cajones -->
        <line x1="50" y1="80" x2="50" y2="120" class="stroke-thin"/>
        <circle cx="30" cy="100" r="2" class="fill-ink"/>
        <circle cx="70" cy="100" r="2" class="fill-ink"/>
      </g>

      <!-- mostrador -->
      <rect x="0" y="200" width="413" height="48" class="fill-warm" stroke="#1F1B17" stroke-width="2"/>
      <line x1="0" y1="216" x2="413" y2="216" class="stroke-soft" opacity="0.6"/>

      <!-- catálogo abierto sobre el mostrador -->
      <g transform="translate(160, 188)">
        <path d="M 0,12 L 30,8 L 60,12 L 60,18 L 30,14 L 0,18 Z" class="fill-cream" stroke="#1F1B17" stroke-width="1.4"/>
        <line x1="30" y1="9" x2="30" y2="14" class="stroke-thin"/>
      </g>

      <!-- cliente (izq) -->
      <g transform="translate(80, 158)">
        <circle cx="0" cy="0" r="14" class="fill-soft" stroke="#1F1B17" stroke-width="2"/>
        <!-- pelo simple -->
        <path d="M -14,-3 Q -10,-16 0,-15 Q 10,-16 14,-3" fill="#1F1B17"/>
        <!-- cuerpo -->
        <path d="M -16,16 L -22,52 L -10,52 L -8,30 L 8,30 L 10,52 L 22,52 L 16,16 Z" class="fill-cream" stroke="#1F1B17" stroke-width="2"/>
      </g>

      <!-- vendedor (der) -->
      <g transform="translate(250, 158)">
        <circle cx="0" cy="0" r="14" class="fill-soft" stroke="#1F1B17" stroke-width="2"/>
        <!-- pelo -->
        <path d="M -13,-2 Q -10,-15 0,-15 Q 10,-15 13,-2" fill="#1F1B17"/>
        <!-- chaleco/camisa -->
        <path d="M -16,16 L -22,52 L 22,52 L 16,16 Z" fill="#3F4B30" stroke="#1F1B17" stroke-width="2"/>
        <!-- camisa cuello -->
        <path d="M -8,16 L 0,28 L 8,16 Z" class="fill-cream" stroke="#1F1B17" stroke-width="1.4"/>
      </g>

      <!-- burbujita de diálogo entre ambos -->
      <g transform="translate(155, 130)">
        <rect x="-30" y="-12" width="60" height="20" rx="10" class="fill-cream" stroke="#1F1B17" stroke-width="1.4"/>
        <text x="0" y="2" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1F1B17" font-style="italic">acuerdo</text>
      </g>
    </g>

    <text x="266" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1F1B17" font-style="italic">Cierra ahí mismo, en el mostrador.</text>
  </g>
</svg>
